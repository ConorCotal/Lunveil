  Template: |
    `**Nick z MC:**`
    `**Nazwa twojej postaci:**` (imię oraz jeśli obecny to pseudonim)
    `**Wiek twojej postaci:**`
    `**Pochodzenie:**` (nazwa serwera z którego pochodzi twoja postać, nazwa fikcyjnej krainy z której pochodzi, itp..)
    `**Cele postaci:**` (cele które ma twoja postać po przejściu przez wyrwę)
    `**Charakter:**` (charakter postaci osobowość itp. (W punktach bądź zdaniach))
    `**Historia:**` (sensowna historia postaci, kończąca się wciągnięciem przez, swego rodzaju wyrwę w czasoprzestrzeni.)
    `**Wygląd postaci:**` (podeślij screena swojej postaci, możesz też dodatkowo napisać krótki opis)

    Opcjonalnie można dodać własne podpunkty. 
    Parę przykładów:
    > `**Ciekawostki:**`
    > `**Słabe i Mocne Strony:**`
    
